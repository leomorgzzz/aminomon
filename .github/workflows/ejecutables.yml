# Compila el juego para Windows y macOS (con Python incluido) y lo publica
# en Releases. Se activa al subir una etiqueta: git tag v1.0 && git push --tags
name: Ejecutables

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      matrix:
        include:
          - os: windows-latest
            archivo: Aminomon-Windows.exe
          - os: macos-latest
            archivo: Aminomon-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - if: runner.os == 'Windows'
        run: pip install windows-curses
      - run: pyinstaller --onefile --name Aminomon  aminomon.py
      - if: runner.os == 'Windows'
        shell: bash
        run: mv dist/Aminomon.exe "${{ matrix.archivo }}"
      - if: runner.os == 'macOS'
        run: cd dist && zip "../${{ matrix.archivo }}" Aminomon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archivo }}
          path: ${{ matrix.archivo }}

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Aminomon-Windows.exe Aminomon-macOS.zip \
            --repo "$GITHUB_REPOSITORY" --title "Aminomon $GITHUB_REF_NAME" \
            --notes "Descarga el archivo de tu sistema y ábrelo con doble clic."
