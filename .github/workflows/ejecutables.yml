# Compila el juego (con Python incluido) y lo publica en Releases: en Windows
# un instalador, en macOS un .zip. Se activa al subir una etiqueta:
# git tag v1.0 && git push --tags
name: Ejecutables

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pruebas:
    uses: ./.github/workflows/pruebas.yml

  compilar:
    needs: pruebas
    strategy:
      matrix:
        include:
          - os: windows-latest
            archivo: Aminomon-Instalador-Windows.exe
          - os: macos-latest
            archivo: Aminomon-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyinstaller>=6,<7"
      - shell: bash
        run: echo "VERSION = \"${GITHUB_REF_NAME#v}\"" > version.py
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          pip install "windows-curses>=2.3,<3"
          version="${GITHUB_REF_NAME#v}"
          # solo los números (v1.8-beta → 1,8,0,0): el .exe no acepta letras
          set -- $(printf '%s' "$version" | tr -c '0-9' ' ') 0 0 0 0
          numeros="$1,$2,$3,$4"
          cat > version.txt <<FIN
          VSVersionInfo(
            ffi=FixedFileInfo(filevers=($numeros), prodvers=($numeros)),
            kids=[StringFileInfo([StringTable('040A04B0', [
              StringStruct('CompanyName', 'leomorgzzz'),
              StringStruct('FileDescription', 'Aminomon'),
              StringStruct('ProductName', 'Aminomon'),
              StringStruct('FileVersion', '$version'),
              StringStruct('ProductVersion', '$version'),
              StringStruct('LegalCopyright', 'MIT · leomorgzzz'),
              StringStruct('OriginalFilename', 'Aminomon.exe')])]),
              VarFileInfo([VarStruct('Translation', [0x040A, 1200])])])
          FIN
          pyinstaller --onedir --noconfirm --name Aminomon --icon icono.ico \
            --version-file version.txt aminomon.py
          # sin el módulo de curses el .exe se abre y se cierra sin hacer nada
          ls dist/Aminomon/_internal/_curses*.pyd
          if ! command -v iscc >/dev/null; then
            [ -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup -y --no-progress
            export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
          fi
          iscc "//DVersion=$version" instalador.iss
      - if: runner.os == 'macOS'
        run: |
          pyinstaller --onefile --name Aminomon aminomon.py
          cd dist && zip "../${{ matrix.archivo }}" Aminomon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archivo }}
          path: ${{ matrix.archivo }}

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Aminomon-Instalador-Windows.exe Aminomon-macOS.zip \
            --repo "$GITHUB_REPOSITORY" --title "Aminomon $GITHUB_REF_NAME" \
            --notes "Windows: descarga el instalador y ábrelo. macOS: descarga el .zip y abre Aminomon."
